name: Site checks

on:
  pull_request:
  push:
    branches:
      # The repository default branch and GitHub Pages source are both master.
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run site tests
        run: npm test

      - name: Check generated product pages
        run: npm run check:site
